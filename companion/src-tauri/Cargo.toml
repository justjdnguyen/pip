[package]
name = "better-pip-host"
version = "0.1.0"
description = "Better PiP companion app: borderless, always-on-top Picture-in-Picture windows"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Fast-running dev builds: optimise dependencies once, keep our crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
