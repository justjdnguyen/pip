[package]
name = "better-pip-host"
version = "0.1.0"
description = "Better PiP companion app: borderless, always-on-top Picture-in-Picture windows"
edition = "2021"
license = "MIT"
repository = "https://github.com/justjdnguyen/pip"
default-run = "better-pip-host"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
anyhow = "1"
base64 = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
# Native video (video/macos.rs): AVSampleBufferDisplayLayer fed with H.264 samples.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-media", "objc2-quartz-core", "AVAnimation", "AVQueuedSampleBufferRendering", "AVSampleBufferDisplayLayer",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColor"] }
objc2-core-media = { version = "0.3", default-features = false, features = [
  "std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CALayer"] }
# Only the avsb_spike test source uses these (H.264 encoder).
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-video-toolbox = { version = "0.3", default-features = false, features = [
  "std", "objc2-core-media", "objc2-core-video", "VTCompressionProperties", "VTCompressionSession", "VTErrors", "VTSession",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Fast-running dev builds: optimise dependencies once, keep our crate quick to rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
